# Example voice configuration for the beat worker (backend/beat_worker.py).
#
# Copy this file to `beats.toml` at the project root (or point
# SILL_BEAT_CONFIG at a copy living anywhere else) and edit the prompts,
# transcript directories, and output globs to fit your own voices.
#
# Each [[voice]] table is one slot in the rotation. The worker cycles
# through them in the order they appear here, one voice per
# SILL_BEAT_INTERVAL_SECONDS tick (default 7200s = 2h), so with two voices
# each one fires roughly every 4h.
#
# Fields (all paths are relative to the project root):
#   name         - short identifier; used in logs and transcript labels
#   prompt       - path to this voice's standing prompt, read fresh before
#                  every beat (a missing file skips that beat and logs an
#                  error rather than crashing the worker)
#   transcripts  - directory where this voice's subprocess transcripts land
#   output_glob  - glob matched against the repo before and after each beat
#                  to verify the voice actually wrote something; a beat
#                  that exits 0 but produces no new match does not advance
#                  rotation (see docs/beats.md for the permissions note
#                  this guards against). Omit this key if a voice has no
#                  reliable output file to check.
#   kickoff      - one-line instruction appended after the standing prompt
#                  when the child session is spawned

[[voice]]
name = "analyst"
prompt = "prompts/analyst.md"
transcripts = "logs/analyst"
output_glob = "notes/analyst-*.md"
kickoff = "Run one beat now. You are running detached — there is no interactive user. Decide and act; do not attempt to elicit direction."

[[voice]]
name = "reflector"
prompt = "prompts/reflector.md"
transcripts = "logs/reflector"
output_glob = "journal/reflector-*.md"
kickoff = "Run one beat now. You are running detached — there is no interactive user. Follow your own thread and write down what you find."
