name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend-tests:
    name: backend tests (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Floor from backend/pyproject.toml (requires-python = ">=3.10") plus a
        # current release. The smoke tests need no DB or network.
        python-version: ["3.10", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install backend with dev extras
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev]'

      - name: Run pytest
        working-directory: backend
        run: pytest -v
